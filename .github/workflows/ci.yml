name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src run_pipeline.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run sanitized CLI smoke test
        run: |
          python run_pipeline.py --main sample_data/main_sanitized.csv --output smoke_output
          test -n "$(find smoke_output -maxdepth 1 -name '*.xlsx' -print -quit)"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt
